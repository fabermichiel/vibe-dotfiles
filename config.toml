active_model = "mistral-large-latest"
default_agent = "po"
system_prompt_id = "po"
enable_telemetry = false
outside_workdir = "deny"

applied_migrations = [
    "bash_read_only_defaults_v1",
]

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[[providers]]
name = "llamacpp"
api_base = "http://127.0.0.1:8080/v1"
api_key_env_var = ""
api_style = "openai"
backend = "generic"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[[models]]
name = "mistral-large-4-0"
provider = "mistral"
input_price = 1.5
output_price = 7.5
thinking = "high"
supports_images = true

[[models]]
name = "mistral-large-latest"
provider = "mistral"
input_price = 1.5
output_price = 7.5
thinking = "high"
supports_images = true

[project_context]
default_commit_count = 5
timeout_seconds = 2.0

[session_logging]
save_dir = "/home/michiel/.vibe/logs/session"
session_prefix = "session"
enabled = true

[tools.task]
permission = "ask"
allowlist = [
    "explore",
]
denylist = []

[tools.web_fetch]
permission = "ask"
allowlist = []
denylist = []

[tools.ask_user_question]
permission = "always"
allowlist = []
denylist = []

[tools.grep]
permission = "always"
allowlist = []
denylist = []
max_output_bytes = 64000
default_max_matches = 100
default_timeout = 60
exclude_patterns = [
    ".venv/",
    "venv/",
    ".env/",
    "env/",
    "node_modules/",
    ".git/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".tox/",
    ".nox/",
    ".coverage/",
    "htmlcov/",
    "dist/",
    "build/",
    ".idea/",
    ".vscode/",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".DS_Store",
    "Thumbs.db",
]
codeignore_file = ".vibeignore"

[tools.read_file]
permission = "always"
allowlist = []
denylist = []
max_read_bytes = 64000


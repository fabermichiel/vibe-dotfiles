[tools.write_file]
permission = "ask"
allowlist = []
denylist = []
max_write_bytes = 64000
create_parent_dirs = true

[tools.write_edit]
permission = "ask"
allowlist = []
denylist = []

[tools.todo]
permission = "always"
allowlist = []
denylist = []
max_todos = 100

[tools.web_search]
permission = "ask"
allowlist = []
denylist = []
timeout = 120
model = "mistral-vibe-cli-with-tools"

[tools.edit]
permission = "ask"
allowlist = []
denylist = []
fuzzy_threshold = 0.9

[budget]
# Global budget limits (per-session defaults; per-agent overrides in agents/*.toml)
max_input_tokens = 200000
max_output_tokens = 64000
max_cost_usd = 20.0

agent_type = "subagent"

display_name = "System Tester"

description = "System and integration tester. Validates end-to-end workflows, cross-component interactions, data flow through the system, and feature integration. Focuses on complete system behavior rather than individual components, following gangbare werkwijzen and best practices."

safety = "neutral"

system_prompt_id = "system-tester"

enabled_tools = [
    "read_file",
    "grep",
    "write_file",
    "search_replace",
    "bash",
    "web_search",
    "web_fetch",
    "todo",
    "ask_user_question"
]

[tools.write_file]
permission = "always"

[tools.search_replace]
permission = "always"

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[tools.web_search]
permission = "ask"

[tools.web_fetch]
permission = "ask"

[tools.todo]
permission = "always"

[tools.ask_user_question]
permission = "always"


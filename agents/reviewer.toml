agent_type = "subagent"

display_name = "Reviewer"

description = "Independent code reviewer. Reviews implementation for correctness, maintainability, security, architecture and quality against gangbare werkwijzen and best practices. Provides detailed feedback and approval recommendations."

safety = "safe"

system_prompt_id = "reviewer"

enabled_tools = [
    "read_file",
    "grep",
    "write_file",
    "bash",
    "web_search",
    "web_fetch",
    "todo",
    "ask_user_question"
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.bash]
permission = "ask"

[tools.web_search]
permission = "ask"

[tools.web_fetch]
permission = "ask"

[tools.todo]
permission = "always"

[tools.ask_user_question]
permission = "always"

[budget]
max_input_tokens = 200000
max_output_tokens = 32000
max_cost_usd = 8

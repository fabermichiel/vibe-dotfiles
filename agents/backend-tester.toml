agent_type = "subagent"

display_name = "Backend Tester"

description = "Senior backend tester. Validates backend functionality, API contracts, data integrity, security and error handling. Creates test cases, reports issues and follows gangbare werkwijzen and best practices."

safety = "neutral"

system_prompt_id = "backend-tester"

enabled_tools = [
    "read_file",
    "grep",
    "write_file",
    "search_replace",
    "bash",
    "web_search",
    "web_fetch",
    "todo",
    "ask_user_question"
]

[tools.write_file]
permission = "always"

[tools.search_replace]
permission = "always"

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[tools.web_search]
permission = "ask"

[tools.web_fetch]
permission = "ask"

[tools.todo]
permission = "always"

[tools.ask_user_question]
permission = "always"

[budget]
max_input_tokens = 150000
max_output_tokens = 48000
max_cost_usd = 8
